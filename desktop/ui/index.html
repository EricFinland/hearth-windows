<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>hearth</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<svg class="icon-defs" aria-hidden="true" focusable="false" width="0" height="0">
  <defs>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12h13M11 6l6 6-6 6"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h9a1.5 1.5 0 0 1 1.5 1.5v7.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-cross" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5l7 2.5v5.5c0 4.2-2.9 7.6-7 9.5-4.1-1.9-7-5.3-7-9.5V6z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M4 9h9.5a5.5 5.5 0 1 1 0 11H8"/><path d="M8 4.5L3.5 9 8 13.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.5l8.5 15h-17z"/><path d="M12 10v4.2M12 16.8v.4"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M13.5 3.5H7A1.5 1.5 0 0 0 5.5 5v14A1.5 1.5 0 0 0 7 20.5h10a1.5 1.5 0 0 0 1.5-1.5V8.5z"/><path d="M13.5 3.5v5h5"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4.5 19.5l.7-3.7L15.6 5.4a2 2 0 0 1 2.8 0l.2.2a2 2 0 0 1 0 2.8L8.2 18.8z"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><path d="M5 7.5l4.5 4.5L5 16.5M12.5 17h6.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.2"/><path d="M15.6 15.6L20 20"/></symbol>
    <symbol id="i-git" viewBox="0 0 24 24"><circle cx="7" cy="6.5" r="2.5"/><circle cx="7" cy="17.5" r="2.5"/><circle cx="17" cy="12" r="2.5"/><path d="M7 9v6M9.5 6.9h3A2 2 0 0 1 14.5 9v1"/></symbol>
    <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/><path d="M9.5 3.5v3M14.5 3.5v3M9.5 17.5v3M14.5 17.5v3M3.5 9.5h3M3.5 14.5h3M17.5 9.5h3M17.5 14.5h3"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4.5V10h-5.5"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H21M18 12v3M15 12v2.2"/></symbol>
  </defs>
</svg>

<div class="app">

  <header class="titlebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-word">hearth</span>
    </div>

    <div class="chips" id="chips">
      <span class="chip" id="chip-workspace" title="workspace"><svg class="i"><use href="#i-folder"/></svg><span class="chip-text">no workspace</span></span>
      <span class="chip" id="chip-model" title="model"><svg class="i"><use href="#i-cpu"/></svg><span class="chip-text">no model</span></span>
      <span class="chip" id="chip-mode" title="permission mode"><svg class="i"><use href="#i-shield"/></svg><span class="chip-text">edit</span></span>
    </div>

    <div class="conn" id="conn" role="status" aria-live="polite">
      <span class="conn-dot" aria-hidden="true"></span>
      <span class="conn-label" id="conn-label">connecting</span>
    </div>
  </header>

  <div class="body">

    <aside class="sidebar" aria-label="session">

      <section class="panel" aria-labelledby="p-session">
        <h2 class="panel-title" id="p-session">Session</h2>

        <label class="field">
          <span class="field-label">Workspace</span>
          <div class="field-row">
            <input class="input mono" id="in-workspace" type="text" spellcheck="false"
                   autocomplete="off" placeholder="C:\path\to\project" list="dl-workspaces" />
            <button class="btn btn-ghost btn-icon" id="btn-browse" type="button" title="Browse for a folder">
              <svg class="i"><use href="#i-folder"/></svg>
            </button>
          </div>
          <datalist id="dl-workspaces"></datalist>
        </label>

        <label class="field">
          <span class="field-label">Model</span>
          <div class="field-row">
            <select class="input" id="in-model"></select>
            <button class="btn btn-ghost btn-icon" id="btn-models" type="button" title="Reload installed models">
              <svg class="i"><use href="#i-refresh"/></svg>
            </button>
          </div>
        </label>

        <label class="field">
          <span class="field-label">Permission mode</span>
          <select class="input" id="in-mode">
            <option value="plan">plan &middot; read only, no writes</option>
            <option value="edit" selected>edit &middot; ask before writing</option>
            <option value="auto">auto &middot; write without asking</option>
          </select>
        </label>

        <button class="btn btn-primary btn-wide" id="btn-connect" type="button">Start session</button>
        <p class="panel-note" id="session-note"></p>
      </section>

      <section class="panel" aria-labelledby="p-env">
        <h2 class="panel-title" id="p-env">
          Backend
          <button class="btn btn-ghost btn-icon panel-action" id="btn-setup" type="button" title="Re-run diagnosis">
            <svg class="i"><use href="#i-refresh"/></svg>
          </button>
        </h2>
        <div id="setup-body" class="setup-body">
          <p class="panel-note">Checking&hellip;</p>
        </div>
      </section>

      <section class="panel panel-grow" aria-labelledby="p-cp">
        <h2 class="panel-title" id="p-cp">
          Checkpoints
          <button class="btn btn-ghost btn-icon panel-action" id="btn-checkpoints" type="button" title="Reload checkpoints">
            <svg class="i"><use href="#i-refresh"/></svg>
          </button>
        </h2>
        <ul class="cp-list" id="cp-list"></ul>
        <p class="panel-note" id="cp-note">No session yet.</p>
      </section>

    </aside>

    <main class="chat">
      <div class="transcript" id="transcript" role="log" aria-live="polite" aria-relevant="additions text"></div>

      <div class="composer">
        <div class="composer-inner">
          <textarea class="composer-input" id="composer" rows="1" spellcheck="false"
                    placeholder="Ask hearth to do something in this workspace" disabled></textarea>
          <div class="composer-actions">
            <button class="btn btn-danger btn-icon" id="btn-stop" type="button" title="Stop this turn (Esc)" hidden>
              <svg class="i"><use href="#i-stop"/></svg>
            </button>
            <button class="btn btn-primary btn-icon" id="btn-send" type="button" title="Send (Enter)" disabled>
              <svg class="i"><use href="#i-send"/></svg>
            </button>
          </div>
        </div>
        <div class="composer-hint">
          <span id="composer-status">Start a session to begin.</span>
          <span class="composer-keys"><kbd>Enter</kbd> send &middot; <kbd>Shift</kbd>+<kbd>Enter</kbd> newline &middot; <kbd>Esc</kbd> stop</span>
        </div>
      </div>
    </main>

  </div>
</div>

<div class="modal-scrim" id="modal-scrim" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal">
    <h3 class="modal-title" id="modal-title"></h3>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
