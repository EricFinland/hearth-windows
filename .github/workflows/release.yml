name: Release

# Turns a tag into something you can send someone a link to.
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# It does not build its own installer. It calls build.yml, the same workflow
# that gates every push, so the file attached to a release is the file CI
# tested rather than one produced by a recipe that only runs on release day.
#
# The release is published straight away and marked as the latest one, so
# the "Download" link in the README (releases/latest) points at it. Pushing a
# version tag is the decision to publish. To review first, run this workflow
# by hand with "draft" ticked and publish the draft from the releases page.
#
# The installer is unsigned (there is no code-signing certificate). The
# release notes say so in the first paragraph, tell a non-technical user
# exactly which buttons to press, and give them the hash to check: see
# docs/download.md and docs/code-signing-policy.md.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release from (e.g. v0.1.0)
        required: true
      draft:
        description: Create as a draft to review before publishing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    # A called workflow can only use permissions its caller grants. build.yml's
    # installer job attests the binary, which needs these two; without them
    # GitHub rejects this whole file before any job runs.
    permissions:
      contents: read
      id-token: write
      attestations: write

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the installer CI built
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.installer-artifact }}
          path: dist

      - name: Work out what this release is
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          exe=$(find dist -name '*.exe' | head -1)
          if [ -z "$exe" ]; then
            echo "::error::no installer in the build artifact"
            exit 1
          fi
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
          echo "exe_name=$(basename "$exe")" >> "$GITHUB_OUTPUT"

          # The version the application actually reports is the one in
          # tauri.conf.json, not the one in the tag. If a tag says v0.2.0 and
          # the app says 0.1.0, the updater's downgrade check compares against
          # the wrong number and the release lies about itself. Cheaper to
          # refuse the release than to publish that.
          conf=$(python -c "import json;print(json.load(open('desktop/tauri/tauri.conf.json'))['version'])")
          echo "version=$conf" >> "$GITHUB_OUTPUT"
          if [ "$tag" != "v$conf" ]; then
            echo "::error::tag $tag does not match tauri.conf.json version $conf."
            echo "Bump the version and re-tag, or tag v$conf."
            exit 1
          fi

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.exe | tee SHA256SUMS.txt

      - name: Release notes
        shell: bash
        run: |
          exe="${{ steps.meta.outputs.exe_name }}"
          sha=$(sha256sum "${{ steps.meta.outputs.exe }}" | cut -d' ' -f1)
          cat > NOTES.md <<EOF
          ## Hearth for Windows ${{ steps.meta.outputs.tag }}

          Run local AI models and an autonomous coding agent on your own
          Windows computer, for free. The installer carries everything it
          needs, so nothing else has to be installed first.

          ### How to install (no technical knowledge needed)

          1. Under **Assets** below, click **\`$exe\`** to download it.
             If your browser says the file "isn't commonly downloaded", choose
             **Keep** (in Edge: **...** then **Keep**, then **Keep anyway**).
          2. Double-click the downloaded file.
          3. Windows shows a blue screen saying **"Windows protected your PC"**.
             Click **More info**, then click **Run anyway**.
          4. Click through the installer. It does not need administrator rights.
          5. Open **Hearth** from the Start menu, then pick a model that fits
             your computer in the model shop.

          Full step-by-step guide, including antivirus and work computers:
          [docs/download.md](https://github.com/EricFinland/hearth-windows/blob/main/docs/download.md)

          ### Why does Windows warn me?

          Hearth is free and 100% open source, but it does not have a paid
          code-signing certificate, so Windows calls the publisher "unknown".
          The warning is about the missing certificate, not about anything
          found in the file. You do not have to take our word for it:

          - **Check the file.** In PowerShell, in your Downloads folder:

            \`\`\`
            Get-FileHash .\\$exe
            \`\`\`

            The hash it prints should be (PowerShell shows it in capitals;
            that is the same hash):

            \`\`\`
            $sha
            \`\`\`

          - **Check where it came from.** This installer was built by GitHub
            Actions from this repository's public source, and GitHub attests
            to that:

            \`\`\`
            gh attestation verify $exe -R ${{ github.repository }}
            \`\`\`

          - **Build it yourself.**
            [docs/getting-started.md](https://github.com/EricFinland/hearth-windows/blob/main/docs/getting-started.md)
            walks through it.

          Only download Hearth from this releases page. A copy from anywhere
          else is not an official release.

          ### What you need

          Windows 10 or 11, and enough RAM for the model you pick (about 8 GB
          free for a small one). Hearth measures your machine and tells you
          which models actually fit. A graphics card helps and is not required.

          ### Updating

          Hearth checks this page for a new version each time it starts, and
          shows **Install now** when there is one; it verifies the download
          against its own release key before anything runs, and your models
          and settings are kept. Hearth 0.1.1 and older cannot update
          themselves: download the installer below and run it once, and every
          update after that happens inside the app.

          ### Known gaps

          - AMD and Intel GPU memory is under-reported, so those machines
            offload less than they could and run slower than they should.
          - No cloud API keys. Local models only.

          Built from \`${{ github.sha }}\`.
          EOF
          echo "--- notes ---"; cat NOTES.md

      # The in-app updater's feed. Installed copies of Hearth fetch
      # manifest-stable.json from releases/latest/download/ and accept it only
      # when it carries a signature from a key in release/trust.json, so this
      # step is what makes a release reachable from inside the app.
      #
      # The secret HEARTH_UPDATE_SIGNING_KEY holds exactly the 64 hex
      # characters of the "private_seed" value from a key file written by
      # `release_manifest.py keygen`, nothing else. It is written to a file
      # that only this user can read (umask 077), passed to the signer as a
      # path (never as an argument, which every process can see), and removed
      # on every exit path. There is no `set -x` here, so no line of this
      # script is echoed with the secret expanded; GitHub also masks it.
      #
      # Without the secret the release still publishes, with a warning, and
      # in-app updates simply do not see it. A secret that IS set but does not
      # belong to an active key in release/trust.json fails the job, because
      # that is a mistake to fix rather than a release to ship.
      - name: Sign the update manifest
        id: manifest
        shell: bash
        env:
          HEARTH_UPDATE_SIGNING_KEY: ${{ secrets.HEARTH_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HEARTH_UPDATE_SIGNING_KEY:-}" ]; then
            echo "::warning::HEARTH_UPDATE_SIGNING_KEY is not set, so this release carries no signed update manifest and in-app updates are disabled for this release. Installed copies of Hearth will not offer it; people have to download it by hand. See docs/updates.md."
            echo "assets=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          umask 077
          seed_file=$(mktemp)
          notes_file=""
          trap 'shred -u "$seed_file" 2>/dev/null || rm -f "$seed_file"; rm -f "$notes_file"' EXIT
          printf '%s' "$HEARTH_UPDATE_SIGNING_KEY" > "$seed_file"
          unset HEARTH_UPDATE_SIGNING_KEY

          tag="${{ steps.meta.outputs.tag }}"
          version="${{ steps.meta.outputs.version }}"
          exe="${{ steps.meta.outputs.exe }}"
          # Short notes for the in-app banner and panel (at most 4000
          # characters; the client refuses more). release/notes/<tag>.txt
          # overrides the default one-liner when a release wants to say more.
          notes_file=$(mktemp)
          if [ -f "release/notes/$tag.txt" ]; then
            cp "release/notes/$tag.txt" "$notes_file"
          else
            printf 'Hearth %s. What changed: https://github.com/%s/releases/tag/%s\n' \
              "$version" "${{ github.repository }}" "$tag" > "$notes_file"
          fi

          # 180 days: comfortably longer than the gap between releases, well
          # under the client's 400-day ceiling. When the newest manifest
          # expires, checks fail (calmly) until a new release or a re-signed
          # manifest is published; docs/updates.md says how to re-sign.
          python scripts/release_manifest.py sign \
            --installer "$exe" \
            --version "$version" \
            --seed-file "$seed_file" \
            --layout github-releases \
            --valid-days 180 \
            --notes-file "$notes_file" \
            --out "$(dirname "$exe")"

          manifest="$(dirname "$exe")/manifest-stable.json"
          test -f "$manifest"
          echo "assets=$manifest" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "Hearth for Windows ${{ steps.meta.outputs.tag }}" \
            --notes-file NOTES.md \
            $([ "${{ github.event.inputs.draft }}" = "true" ] && echo --draft || echo --latest) \
            dist/*.exe dist/SHA256SUMS.txt ${{ steps.manifest.outputs.assets }}

      - name: Where to look
        run: |
          echo "Release created:"
          echo "  https://github.com/${{ github.repository }}/releases"
