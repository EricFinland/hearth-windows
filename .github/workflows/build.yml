name: build

# Everything here runs on a GitHub-hosted runner, on purpose.
#
# Hearth's installer is unsigned, and the route to signing it is SignPath
# Foundation's free certificate for open-source projects. That programme has a
# hard requirement: every job that touches the artifact must run on a
# GitHub-hosted runner, so the binary SignPath signs is demonstrably the one
# this public repository's source produced. A self-hosted runner, a locally
# built installer uploaded by hand, or a job on any other provider all fail
# that requirement. So the build lives here rather than on the maintainer's
# desktop, even though the desktop is faster.
#
# See docs/code-signing-policy.md for what this workflow has to grow before
# signing is switched on, and why the signing step is not in this file yet.

# The installer job downloads a pinned llama.cpp and CPython and compiles the
# Rust shell, which is about half an hour of runner time. Prose cannot change
# what that produces, so a change to the documentation site or to a markdown
# file does not run it. Measured rather than assumed: the commit that added
# site/ triggered a full thirty-minute installer build to package bytes it had
# not touched.
#
# docs/ is ignored too. Checked rather than assumed: build_windows.py and
# third_party_notices.py both mention docs/ paths, but only inside error
# messages pointing a reader at an explanation. Neither opens a file there, so
# nothing under docs/ can change what this workflow builds.
#
# A change under docs/ is not unchecked, it is checked elsewhere: deploy-docs.yml
# triggers on docs/** and re-runs site/port_docs.py, failing if the published
# pages no longer match. That is the gate a documentation change needs, and it
# costs half a minute instead of half an hour.
on:
  push:
    branches: [ main ]
    paths-ignore: &prose
      - 'site/**'
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [ main ]
    paths-ignore: *prose
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Windows runners default to a legacy code page. The engine writes and reads
  # UTF-8 everywhere and asserts it in its own self-tests, so state it rather
  # than inherit it.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # Fast gate. Every module under agent/ and desktop/server/ carries its own
  # checks behind --self-test: standard library only, no network, no model, no
  # test runner. This job needs nothing except Python, so it fails in about a
  # minute when something is broken rather than after the installer build.
  self-test:
    name: self-tests (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned to the interpreter Hearth ships. vendor/python_manifest.json
          # pins CPython 3.12.10 for the installer payload; testing on the same
          # line is the point of pinning it at all.
          python-version: "3.12"

      - name: Report the toolchain
        shell: bash
        run: |
          python --version
          rustc --version
          cargo --version

      - name: Engine and sidecar self-tests
        shell: bash
        run: |
          set -u
          failed=0
          total=0
          for m in agent/*.py desktop/server/*.py; do
            total=$((total + 1))
            echo "--- $m"
            if ! python "$m" --self-test; then
              echo "::error file=$m::self-test failed"
              failed=$((failed + 1))
            fi
          done
          echo "ran $total self-test(s), $failed failure(s)"
          test "$failed" -eq 0

      - name: Build-tooling self-tests
        shell: bash
        run: |
          set -u
          failed=0
          # build_windows.py and e2e_live.py have no --self-test by design: the
          # first IS the build and the second needs a real model. Every other
          # script in scripts/ carries one.
          for m in scripts/loop_bench.py scripts/make_icon.py \
                   scripts/release_manifest.py scripts/third_party_notices.py \
                   scripts/vendor_llama.py scripts/vendor_python.py; do
            echo "--- $m"
            if ! python "$m" --self-test; then
              echo "::error file=$m::self-test failed"
              failed=$((failed + 1))
            fi
          done
          test "$failed" -eq 0

  # The real build. Fetches and checksums the pinned llama.cpp and CPython,
  # stages the payload, proves the staged payload runs under the staged
  # interpreter, compiles the Tauri shell, and produces the NSIS installer.
  # scripts/verify_binary.py then reads the hardening back out of the built
  # exe rather than trusting that the build asked for it.
  installer:
    name: windows installer
    needs: self-test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Rust, not Node. The shell was Electron until the Tauri port; this job
      # used to set up Node 22 and cache desktop/shell/package-lock.json, a
      # file the port deleted. That is why this step is worth reading twice:
      # the workflow had never run, so nothing ever reported that it pointed
      # at a path which no longer exists.
      #
      # rustc and cargo are preinstalled on windows-latest, well past the
      # 1.82 desktop/tauri/Cargo.toml asks for, so there is no toolchain
      # action here. cargo-tauri is not preinstalled, and building it from
      # source costs minutes on every run, so it is cached as a binary.
      - name: Cache the Tauri bundler
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: cargo-tauri-v2-${{ runner.os }}

      - name: Install the Tauri bundler
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        shell: bash
        # Pinned to the major that desktop/tauri/Cargo.toml depends on. --locked
        # builds it from its own committed lockfile rather than resolving fresh
        # dependencies at install time.
        run: cargo install tauri-cli --version "^2" --locked

      - name: Cache the crate registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('desktop/tauri/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Build the installer
        shell: bash
        # No token is mapped into this job, and that is deliberate rather than
        # an omission. It mattered sharply under electron-builder, which
        # publishes a GitHub release by itself the moment it finds GH_TOKEN or
        # GITHUB_TOKEN in the environment; `cargo tauri build` has no such
        # behaviour, so the rule is now a boundary rather than a defusing.
        # This job builds and uploads an artifact and publishes nothing.
        # Releasing is a separate, deliberate act: see docs/updates.md, where
        # what reaches users is decided by the signing key and not by whatever
        # a build job happened to produce.
        run: python scripts/build_windows.py

      - name: Third-party notices are not stale
        shell: bash
        # Deliberately after the build. The notices describe the engine that
        # actually ships, so --check cannot run until vendor/llama is on disk,
        # which only the build step puts there.
        run: python scripts/third_party_notices.py --check

      - name: Record what was built
        shell: bash
        run: |
          ls -la build/dist
          # A digest in the log is the cheapest possible provenance: it lets
          # anyone compare a downloaded artifact against the run that made it.
          sha256sum build/dist/*.exe

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: hearth-windows-installer
          path: build/dist/*.exe
          if-no-files-found: error
          retention-days: 30
