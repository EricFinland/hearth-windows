<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Hearth for Windows: local LLMs and an autonomous coding agent that asks before it writes">
  <defs>
    <radialGradient id="glow" cx="14%" cy="48%" r="38%">
      <stop offset="0%" stop-color="#4a9eff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#4a9eff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a9eff"/>
      <stop offset="100%" stop-color="#a8d0ff"/>
    </linearGradient>
    <clipPath id="panelClip">
      <rect width="452" height="256" rx="12"/>
    </clipPath>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="360" fill="#131922"/>
  <rect width="1200" height="6" fill="url(#bar)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <!-- flame -->
  <g transform="translate(74,110) scale(4.3)">
    <path d="M16 3 C 11 10 8 13 8 19 a8 8 0 0 0 16 0 c0 -4 -3 -7 -5 -9 c0 2 -1 3 -2 3 c1 -4 -1 -9 -1 -13 z" fill="#4a9eff">
      <animate attributeName="opacity" values="1;0.82;1" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M16 12 C 14 15 13 16 13 19.5 a3 3 0 0 0 6 0 c0 -2 -1 -3 -2 -4 c0 1 -1 2 -2 1 z" fill="#a8d0ff">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- wordmark. Every line below is measured to end before the panel at
       x=700: the panel is opaque and painted last, so anything wider than
       that is not overlapped, it is erased. -->
  <text x="234" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="500" fill="#f2f6fa" letter-spacing="-2">hearth</text>
  <text x="238" y="206" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#4a9eff" letter-spacing="0.5">for Windows</text>
  <text x="239" y="250" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#b6c2d0">Local LLMs and an autonomous coding</text>
  <text x="239" y="277" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#b6c2d0">agent, on your own machine.</text>
  <text x="240" y="314" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#82909f" letter-spacing="0.5">llama.cpp &#183; Tauri &#183; no cloud &#183; Apache-2.0</text>

  <!-- The app, mid-approval. This is the thing worth showing: Hearth stops
       before it writes and shows you the diff. A terminal mock would be
       showing a Linux CLI on the page for a Windows desktop application. -->
  <g transform="translate(700,52)">
    <g clip-path="url(#panelClip)">
      <rect width="452" height="256" fill="#0e141b"/>
      <rect width="452" height="38" fill="#182029"/>
    </g>
    <rect width="452" height="256" rx="12" fill="none" stroke="#2f3945"/>

    <!-- title bar, with Windows controls rather than three dots -->
    <text x="18" y="25" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" fill="#b6c2d0">Hearth</text>
    <g stroke="#82909f" stroke-width="1.2" fill="none">
      <path d="M372 19 h11"/>
      <rect x="400" y="14" width="10" height="10"/>
      <path d="M428 14 l11 11 M439 14 l-11 11"/>
    </g>

    <!-- what it wants to do -->
    <rect x="18" y="56" width="86" height="22" rx="5" fill="#0b1d33" stroke="#4a9eff"/>
    <text x="61" y="71" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a9eff">write_file</text>
    <text x="434" y="71" text-anchor="end" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" fill="#57657a">edit mode</text>

    <text x="18" y="101" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13.5" fill="#b6c2d0">src\parser.py</text>

    <!-- the diff it is asking about -->
    <rect x="18" y="114" width="416" height="72" rx="6" fill="#131922" stroke="#2f3945"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#7fd1a0">
      <text x="32" y="140">+ def parse(path):</text>
      <text x="32" y="164">+     return Path(path).read_text()</text>
    </g>

    <!-- and the two buttons that make it a decision -->
    <rect x="18" y="202" width="104" height="34" rx="6" fill="#4a9eff"/>
    <text x="70" y="224" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="600" fill="#0b1d33">Approve</text>
    <rect x="132" y="202" width="84" height="34" rx="6" fill="none" stroke="#2f3945"/>
    <text x="174" y="224" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="13.5" fill="#b6c2d0">Deny</text>
    <text x="434" y="224" text-anchor="end" font-family="-apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#57657a">nothing leaves this machine</text>
  </g>
</svg>
